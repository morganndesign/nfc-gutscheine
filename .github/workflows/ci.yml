name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHP 8.4 · MySQL 8.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: giftcard_test
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, pdo_mysql, pdo_sqlite, gd, zip, bcmath, redis
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Code style (Pint)
        run: vendor/bin/pint --test
      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Tests (SQLite)
        run: php artisan test
      - name: Tests (MySQL — real row locking)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: giftcard_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          sed -e 's#<env name="DB_CONNECTION" value="sqlite"/>##' -e 's#<env name="DB_DATABASE" value=":memory:"/>##' phpunit.xml > phpunit.mysql.xml
          php artisan test --configuration=phpunit.mysql.xml
      - name: Demo data on MySQL, then the integrity check (hash chains and balances after a JSON round trip)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: giftcard_test
          DB_USERNAME: root
          DB_PASSWORD: root
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: |
          php artisan migrate:fresh --seed --force
          php artisan giftcard:verify-chains
      - name: Security audit
        run: composer audit

  dashboard:
    name: Dashboard (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  waiter-app:
    name: Waiter app (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waiter-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated files are up to date (tokens, strings)
        run: |
          dart run tool/generate_tokens.dart --check
          dart run tool/import_strings.dart --check
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android release build
        run: flutter build apk --release --dart-define-from-file=config/production.json

  waiter-app-ios:
    name: Waiter app iOS build (unsigned)
    runs-on: macos-15
    defaults:
      run:
        working-directory: waiter-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: iOS release build (no signing; TestFlight uploads run in testflight.yml)
        run: flutter build ios --release --no-codesign --dart-define-from-file=config/production.json

  docker:
    name: Coolify stack builds from source
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    steps:
      - uses: actions/checkout@v4
      # Exactly what Coolify reads: no .env file, no --env-file, no env_file.
      # Without Coolify's generated values the file must refuse to start (fail-fast);
      # with them (test values here, like the .env Coolify writes) it must be valid.
      - name: Validate docker-compose.coolify.yml (no .env file in the repository)
        run: |
          test ! -e .env
          ! grep -nE '^\s*env_file:' docker-compose.coolify.yml
          ! env -i PATH="$PATH" HOME="$HOME" docker compose -f docker-compose.coolify.yml config --quiet
          docker compose -f docker-compose.coolify.yml config --quiet
        env:
          SERVICE_URL_GATEWAY: https://app.example.com
          SERVICE_FQDN_GATEWAY: app.example.com
          SERVICE_PASSWORD_MYSQL: ci-test
          SERVICE_PASSWORD_MYSQLROOT: ci-test
          SERVICE_PASSWORD_REDIS: ci-test
      - name: Build every service exactly as Coolify does
        run: docker compose -f docker-compose.coolify.yml build
        env:
          SERVICE_URL_GATEWAY: https://app.example.com
          SERVICE_FQDN_GATEWAY: app.example.com
          SERVICE_PASSWORD_MYSQL: ci-test
          SERVICE_PASSWORD_MYSQLROOT: ci-test
          SERVICE_PASSWORD_REDIS: ci-test
