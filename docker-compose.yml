# ---------------------------------------------------------------------------
# GiftCard Pro — production stack (single Hetzner host).
#   docker compose --env-file .env.production up -d
# See docs/DEPLOYMENT.md.
# ---------------------------------------------------------------------------
name: giftcard-pro

x-api: &api
  image: ${REGISTRY:-ghcr.io/your-org}/giftcard-pro-api:${IMAGE_TAG:-latest}
  env_file: ./backend/.env.production
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [internal]
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    networks: [internal, public]
    logging: *logging

  web:
    image: ${REGISTRY:-ghcr.io/your-org}/giftcard-pro-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Universal Links / App Links for the native waiter app (docs/ENVIRONMENT.md). Empty = files answer 404.
      WAITER_IOS_APP_IDS: ${WAITER_IOS_APP_IDS:-}
      WAITER_ANDROID_PACKAGE: ${WAITER_ANDROID_PACKAGE:-}
      WAITER_ANDROID_CERT_SHA256: ${WAITER_ANDROID_CERT_SHA256:-}
    networks: [internal]
    logging: *logging

  api:
    <<: *api
    environment:
      CONTAINER_ROLE: app
      RUN_MIGRATIONS: "true"
    # php-fpm only starts once migrations and cache warm-up have finished.
    healthcheck:
      test: ["CMD", "pgrep", "-f", "php-fpm: master"]
      interval: 10s
      start_period: 120s

  queue:
    <<: *api
    environment:
      CONTAINER_ROLE: worker
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_healthy } # never run jobs against an un-migrated schema
    command: ["php", "artisan", "queue:work", "redis", "--queue=default,notifications", "--sleep=1", "--tries=5", "--max-time=3600", "--max-jobs=1000"]
    healthcheck:
      test: ["CMD", "pgrep", "-f", "queue:work"]
      interval: 30s

  scheduler:
    <<: *api
    environment:
      CONTAINER_ROLE: scheduler
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_healthy } # never run jobs against an un-migrated schema
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD", "pgrep", "-f", "schedule:work"]
      interval: 30s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-buffer-pool-size=512M", "--transaction-isolation=READ-COMMITTED"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-giftcard_pro}
      MYSQL_USER: ${DB_USERNAME:-giftcard}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      retries: 10
    networks: [internal]
    logging: *logging

  backup:
    image: mysql:8.4
    profiles: ["backup"]
    entrypoint: ["/bin/sh", "/backup/backup.sh"]
    env_file: ./backend/.env.production
    volumes:
      - ./infra/scripts/backup.sh:/backup/backup.sh:ro
      - ./backups:/backups
    networks: [internal]

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: false
  public:
