# =============================================================================
# GiftCard Pro — production deployment for Coolify (Build Pack: Docker Compose)
#
#   Coolify → New Resource → Public/Private Repository → Build Pack "Docker Compose"
#   Docker Compose Location: /docker-compose.coolify.yml
#
# Everything is built from this repository on the server. No registry, no pre-built
# application images, no GitHub Actions. Full instructions: docs/DEPLOYMENT.md.
#
#   Coolify proxy (HTTPS, domain) ──▶ gateway :80 ──┬─ /api /sanctum /up /reset-password ─▶ api :9000 (php-fpm)
#                                                   └─ everything else ──────────────────▶ web :3000 (Next.js)
#   migrate (one-shot, every deploy) ─▶ then api · worker · scheduler
#   mysql · redis · backup (internal only, never published)
#
# Values Coolify generates on the first deploy (magic variables, persisted by Coolify):
#   SERVICE_URL_GATEWAY / SERVICE_FQDN_GATEWAY  domain assigned to the gateway service
#   SERVICE_PASSWORD_MYSQL, SERVICE_PASSWORD_MYSQLROOT, SERVICE_PASSWORD_REDIS
# Everything else has a production default; optional settings: .env.production.example.
# =============================================================================

x-laravel-build: &laravel-build
  context: .
  dockerfile: backend/Dockerfile
  target: production

# Shared by migrate, api, worker and scheduler (one Laravel configuration).
x-laravel-env: &laravel-env
  APP_NAME: "GiftCard Pro"
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:-}
  # Public URLs: derived from the gateway domain by the entrypoint unless set explicitly.
  APP_URL: ${APP_URL:-}
  FRONTEND_URL: ${FRONTEND_URL:-}
  CARD_BASE_URL: ${CARD_BASE_URL:-}
  SERVICE_URL_GATEWAY: ${SERVICE_URL_GATEWAY}
  SERVICE_FQDN_GATEWAY: ${SERVICE_FQDN_GATEWAY}
  APP_LOCALE: ${APP_LOCALE:-en}
  APP_FALLBACK_LOCALE: en
  SCHEDULE_TIMEZONE: ${SCHEDULE_TIMEZONE:-Europe/Vienna}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Database (service "mysql")
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:-giftcard_pro}
  DB_USERNAME: ${DB_USERNAME:-giftcard}
  DB_PASSWORD: ${SERVICE_PASSWORD_MYSQL}
  # Redis (service "redis"): sessions, cache, locks, queues
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
  CACHE_STORE: redis
  CACHE_PREFIX: giftcardpro
  QUEUE_CONNECTION: redis
  QUEUE_FAILED_DRIVER: database-uuids
  SESSION_DRIVER: redis
  SESSION_LIFETIME: "480"
  SESSION_ENCRYPT: "true"
  SESSION_SECURE_COOKIE: "true"
  SESSION_SAME_SITE: lax
  SESSION_COOKIE: giftcardpro_session
  SESSION_DOMAIN: ${SESSION_DOMAIN:-}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-}
  SANCTUM_TOKEN_PREFIX: gcp_
  # E-mail (invitations, password links, card e-mails). Without SMTP settings mails are only logged.
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_SCHEME: ${MAIL_SCHEME:-}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-GiftCard Pro}
  OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-}
  # NTAG 424 DNA secure cards (optional)
  NTAG424_META_READ_KEY: ${NTAG424_META_READ_KEY:-}
  NTAG424_FILE_READ_KEY: ${NTAG424_FILE_READ_KEY:-}
  NTAG424_DIVERSIFY_KEYS: ${NTAG424_DIVERSIFY_KEYS:-true}
  SEED_DEMO_DATA: "false"

x-laravel-volumes: &laravel-volumes
  # APP_KEY (if generated) and any files the app stores. Shared by all Laravel containers.
  - laravel-storage:/var/www/html/storage/app

services:
  # ---------------------------------------------------------------- public entry point
  gateway:
    build:
      context: ./infra/docker/gateway
    restart: unless-stopped
    environment:
      # Coolify: route the domain configured for this service to container port 80.
      SERVICE_URL_GATEWAY_80: ""
      API_FASTCGI: api:9000
      WEB_UPSTREAM: web:3000
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/gateway-health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------- Laravel
  migrate:
    build: *laravel-build
    restart: "no"
    exclude_from_hc: true   # Coolify: one-shot job, does not count for the resource's health
    environment:
      <<: *laravel-env
      CONTAINER_ROLE: migrate
    volumes: *laravel-volumes
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  api:
    build: *laravel-build
    restart: unless-stopped
    environment:
      <<: *laravel-env
      CONTAINER_ROLE: app
    volumes: *laravel-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  worker:
    build: *laravel-build
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--queue=default,notifications", "--sleep=1", "--tries=5", "--max-time=3600", "--max-jobs=1000"]
    stop_grace_period: 60s   # lets a running job finish on redeploy
    environment:
      <<: *laravel-env
      CONTAINER_ROLE: worker
    volumes: *laravel-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  scheduler:
    build: *laravel-build
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *laravel-env
      CONTAINER_ROLE: scheduler
    volumes: *laravel-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------- Next.js dashboard
  web:
    build:
      context: ./dashboard
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Universal Links / App Links for the native waiter app (/.well-known/…). Empty = 404.
      WAITER_IOS_APP_IDS: ${WAITER_IOS_APP_IDS:-}
      WAITER_ANDROID_PACKAGE: ${WAITER_ANDROID_PACKAGE:-}
      WAITER_ANDROID_CERT_SHA256: ${WAITER_ANDROID_CERT_SHA256:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------- data
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --transaction-isolation=READ-COMMITTED
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-512M}
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-giftcard_pro}
      MYSQL_USER: ${DB_USERNAME:-giftcard}
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQL}
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_MYSQLROOT}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Nightly logical backup of the database into the "mysql-backups" volume (kept 14 days).
  backup:
    image: mysql:8.4
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu -o pipefail
        echo "Backups at $${BACKUP_TIME} UTC daily, kept $${BACKUP_KEEP_DAYS} days, in /backups"
        while true; do
          now=$$(date -u +%s)
          next=$$(date -u -d "today $${BACKUP_TIME}" +%s)
          [ "$$next" -gt "$$now" ] || next=$$(date -u -d "tomorrow $${BACKUP_TIME}" +%s)
          sleep $$((next - now))
          file="/backups/giftcard_pro_$$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
          if mysqldump -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" --single-transaction --quick --routines --triggers --no-tablespaces "$$MYSQL_DATABASE" | gzip -9 > "$$file.part"; then
            mv "$$file.part" "$$file"
            echo "Backup written: $$file"
          else
            rm -f "$$file.part"
            echo "Backup FAILED" >&2
          fi
          find /backups -name 'giftcard_pro_*.sql.gz' -mtime +"$$BACKUP_KEEP_DAYS" -delete
        done
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-giftcard_pro}
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_MYSQLROOT}
      BACKUP_TIME: ${BACKUP_TIME:-01:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - mysql-backups:/backups
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h mysql -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  mysql-data:
  mysql-backups:
  redis-data:
  laravel-storage:
