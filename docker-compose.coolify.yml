# =============================================================================
# GiftCard Pro — production deployment for Coolify v4 (Build Pack: Docker Compose)
#
#   Coolify → New Resource → Repository → Build Pack "Docker Compose"
#   Docker Compose Location: /docker-compose.coolify.yml
#   Domain: only on the "gateway" service (e.g. https://app.giftcardpro.at)
#
# Rules this file follows so that Coolify starts every container in one step:
#   - no depends_on, no one-shot services, no profiles, no YAML anchors: every
#     service is independent and long-running with restart: unless-stopped;
#   - start-up order is handled inside the containers: the Laravel containers wait
#     for MySQL and Redis, then run the migrations (one at a time, guarded by a
#     lock) before they start serving; the gateway answers 502 until api/web are up;
#   - the Dockerfile paths contain a ${VAR:-default}: Coolify then does NOT rewrite the
#     Dockerfiles with an ARG line for every environment variable. Those ARGs would put
#     the passwords and APP_KEY into the image history and invalidate the build cache;
#     the Dockerfiles need no build arguments at all;
#   - configuration comes only from environment: (no env_file, no .env in the repo).
#     Every ${VAR} has a default except the values Coolify generates:
#     SERVICE_URL_GATEWAY, SERVICE_FQDN_GATEWAY, SERVICE_PASSWORD_MYSQL,
#     SERVICE_PASSWORD_MYSQLROOT, SERVICE_PASSWORD_REDIS. Those are written as
#     ${VAR:?message}: if one is empty (gateway without a domain, or the file started
#     with plain `docker compose` instead of by Coolify) Compose stops before creating
#     any container, with the message, instead of starting MySQL/Laravel without them.
# Optional settings (mail, limits, …): Coolify → Environment Variables. Reference list:
# .env.production.example. Full instructions: docs/DEPLOYMENT.md.
# =============================================================================

services:
  # ---------------------------------------------------------------- public entry point
  gateway:
    build:
      context: ./infra/docker/gateway
      dockerfile: ${GATEWAY_DOCKERFILE:-Dockerfile}
    restart: unless-stopped
    # Bounded logs on the host (audit L1): Docker's default json-file driver never rotates.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      # Coolify routes the domain configured for this service to container port 80.
      SERVICE_URL_GATEWAY_80: ""
      API_FASTCGI: api:9000
      WEB_UPSTREAM: web:3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/gateway-health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------- Laravel API (php-fpm)
  # Also runs the database migrations on start (see infra/docker/php/entrypoint.sh).
  api:
    build:
      context: .
      dockerfile: ${LARAVEL_DOCKERFILE:-backend/Dockerfile}
      target: production
    restart: unless-stopped
    # Bounded logs on the host (audit L1): Docker's default json-file driver never rotates.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      CONTAINER_ROLE: app
      APP_NAME: "GiftCard Pro"
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-}
      # Opens the encrypted keystore in the laravel-storage volume (App\Crypto); never the keys themselves.
      CRYPTO_KEYSTORE_KEY: ${CRYPTO_KEYSTORE_KEY:-}
      # Written into every card (permanent once the first card is personalised); empty = APP_URL + /t.
      TAP_URL: ${TAP_URL:-}
      APP_URL: ${APP_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      SERVICE_URL_GATEWAY: ${SERVICE_URL_GATEWAY:?is empty - give the gateway service an https domain in Coolify, then redeploy}
      SERVICE_FQDN_GATEWAY: ${SERVICE_FQDN_GATEWAY}
      APP_LOCALE: ${APP_LOCALE:-en}
      APP_FALLBACK_LOCALE: en
      SCHEDULE_TIMEZONE: ${SCHEDULE_TIMEZONE:-Europe/Vienna}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-giftcard_pro}
      DB_USERNAME: ${DB_USERNAME:-giftcard}
      DB_PASSWORD: ${SERVICE_PASSWORD_MYSQL:?is empty - deploy this resource with Coolify, which generates it; do not run docker compose by hand}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS:?is empty - deploy this resource with Coolify, which generates it; do not run docker compose by hand}
      CACHE_STORE: redis
      CACHE_PREFIX: giftcardpro
      QUEUE_CONNECTION: redis
      QUEUE_FAILED_DRIVER: database-uuids
      SESSION_DRIVER: redis
      SESSION_LIFETIME: "480"
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: lax
      SESSION_COOKIE: giftcardpro_session
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-}
      SANCTUM_TOKEN_PREFIX: gcp_
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_TIMEOUT: ${MAIL_TIMEOUT:-10}
      MAIL_SCHEME: ${MAIL_SCHEME:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-GiftCard Pro}
      MAIL_LOCALE: ${MAIL_LOCALE:-de}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-}
      SEED_DEMO_DATA: "false"
    volumes:
      - laravel-storage:/var/www/html/storage/app
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s

  # ---------------------------------------------------------------- queue worker
  worker:
    build:
      context: .
      dockerfile: ${LARAVEL_DOCKERFILE:-backend/Dockerfile}
      target: production
    restart: unless-stopped
    # Bounded logs on the host (audit L1): Docker's default json-file driver never rotates.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    command: ["php", "artisan", "queue:work", "redis", "--queue=default,notifications", "--sleep=1", "--tries=5", "--max-time=3600", "--max-jobs=1000"]
    stop_grace_period: 60s
    environment:
      CONTAINER_ROLE: worker
      APP_NAME: "GiftCard Pro"
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-}
      # Opens the encrypted keystore in the laravel-storage volume (App\Crypto); never the keys themselves.
      CRYPTO_KEYSTORE_KEY: ${CRYPTO_KEYSTORE_KEY:-}
      # Written into every card (permanent once the first card is personalised); empty = APP_URL + /t.
      TAP_URL: ${TAP_URL:-}
      APP_URL: ${APP_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      SERVICE_URL_GATEWAY: ${SERVICE_URL_GATEWAY:?is empty - give the gateway service an https domain in Coolify, then redeploy}
      SERVICE_FQDN_GATEWAY: ${SERVICE_FQDN_GATEWAY}
      APP_LOCALE: ${APP_LOCALE:-en}
      APP_FALLBACK_LOCALE: en
      SCHEDULE_TIMEZONE: ${SCHEDULE_TIMEZONE:-Europe/Vienna}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-giftcard_pro}
      DB_USERNAME: ${DB_USERNAME:-giftcard}
      DB_PASSWORD: ${SERVICE_PASSWORD_MYSQL:?is empty - deploy this resource with Coolify, which generates it; do not run docker compose by hand}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS:?is empty - deploy this resource with Coolify, which generates it; do not run docker compose by hand}
      CACHE_STORE: redis
      CACHE_PREFIX: giftcardpro
      QUEUE_CONNECTION: redis
      QUEUE_FAILED_DRIVER: database-uuids
      SESSION_DRIVER: redis
      SESSION_LIFETIME: "480"
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: lax
      SESSION_COOKIE: giftcardpro_session
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-}
      SANCTUM_TOKEN_PREFIX: gcp_
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_TIMEOUT: ${MAIL_TIMEOUT:-10}
      MAIL_SCHEME: ${MAIL_SCHEME:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-GiftCard Pro}
      MAIL_LOCALE: ${MAIL_LOCALE:-de}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-}
      SEED_DEMO_DATA: "false"
    volumes:
      - laravel-storage:/var/www/html/storage/app
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s

  # ---------------------------------------------------------------- scheduler
  scheduler:
    build:
      context: .
      dockerfile: ${LARAVEL_DOCKERFILE:-backend/Dockerfile}
      target: production
    restart: unless-stopped
    # Bounded logs on the host (audit L1): Docker's default json-file driver never rotates.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    command: ["php", "artisan", "schedule:work"]
    environment:
      CONTAINER_ROLE: scheduler
      BACKUP_DIR: /backups
      OFFSITE_ENABLED: ${OFFSITE_SFTP_HOST:-}
      APP_NAME: "GiftCard Pro"
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-}
      # Opens the encrypted keystore in the laravel-storage volume (App\Crypto); never the keys themselves.
      CRYPTO_KEYSTORE_KEY: ${CRYPTO_KEYSTORE_KEY:-}
      # Written into every card (permanent once the first card is personalised); empty = APP_URL + /t.
      TAP_URL: ${TAP_URL:-}
      APP_URL: ${APP_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      SERVICE_URL_GATEWAY: ${SERVICE_URL_GATEWAY:?is empty - give the gateway service an https domain in Coolify, then redeploy}
      SERVICE_FQDN_GATEWAY: ${SERVICE_FQDN_GATEWAY}
      APP_LOCALE: ${APP_LOCALE:-en}
      APP_FALLBACK_LOCALE: en
      SCHEDULE_TIMEZONE: ${SCHEDULE_TIMEZONE:-Europe/Vienna}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-giftcard_pro}
      DB_USERNAME: ${DB_USERNAME:-giftcard}
      DB_PASSWORD: ${SERVICE_PASSWORD_MYSQL:?is empty - deploy this resource with Coolify, which generates it; do not run docker compose by hand}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS:?is empty - deploy this resource with Coolify, which generates it; do not run docker compose by hand}
      CACHE_STORE: redis
      CACHE_PREFIX: giftcardpro
      QUEUE_CONNECTION: redis
      QUEUE_FAILED_DRIVER: database-uuids
      SESSION_DRIVER: redis
      SESSION_LIFETIME: "480"
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: lax
      SESSION_COOKIE: giftcardpro_session
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-}
      SANCTUM_TOKEN_PREFIX: gcp_
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_TIMEOUT: ${MAIL_TIMEOUT:-10}
      MAIL_SCHEME: ${MAIL_SCHEME:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-GiftCard Pro}
      MAIL_LOCALE: ${MAIL_LOCALE:-de}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-}
      SEED_DEMO_DATA: "false"
    volumes:
      - laravel-storage:/var/www/html/storage/app
      # Read-only: ops:check-backups alerts when the last backup or off-site copy is too old.
      - mysql-backups:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s

  # ---------------------------------------------------------------- Next.js dashboard
  web:
    build:
      context: ./dashboard
      dockerfile: ${WEB_DOCKERFILE:-Dockerfile}
    restart: unless-stopped
    # Bounded logs on the host (audit L1): Docker's default json-file driver never rotates.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------- data
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # Bounded logs on the host (audit L1): Docker's default json-file driver never rotates.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --transaction-isolation=READ-COMMITTED
      # The migrations create the append-only triggers on the ledger, payments and audit log as the app user;
      # with binary logging on, MySQL requires this for a non-SUPER user to create triggers.
      - --log-bin-trust-function-creators=1
      - --innodb-buffer-pool-size=512M
      # A request waiting for a row lock gives up after 8 s (default 50 s) and ends with a clean error inside php-fpm's
      # 30-s limit instead of being killed mid-request (502).
      - --innodb-lock-wait-timeout=8
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-giftcard_pro}
      MYSQL_USER: ${DB_USERNAME:-giftcard}
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQL:?is empty - deploy this resource with Coolify, which generates it; do not run docker compose by hand}
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_MYSQLROOT:?is empty - deploy this resource with Coolify, which generates it; do not run docker compose by hand}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP only (the temporary server during first initialisation has no TCP), no password needed.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 180s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Bounded logs on the host (audit L1): Docker's default json-file driver never rotates.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS:?is empty - deploy this resource with Coolify, which generates it; do not run docker compose by hand}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Daily logical backup of the database into the "mysql-backups" volume.
  backup:
    image: mysql:8.4
    restart: unless-stopped
    # Bounded logs on the host (audit L1): Docker's default json-file driver never rotates.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    entrypoint: ["sh", "-c"]
    # Daily: the database (consistent snapshot) and the card keystore (encrypted with CRYPTO_KEYSTORE_KEY; without
    # it no card can ever be verified again). Every dump is checked before it counts; `last_success` is what the
    # scheduler's backup check (ops:check-backups) reads, and the offsite service copies the directory away.
    command:
      - |
        set -eu -o pipefail
        echo "Backups daily at $${BACKUP_TIME} UTC, kept $${BACKUP_KEEP_DAYS} days, in /backups"
        while true; do
          now=$$(date -u +%s)
          next=$$(date -u -d "today $${BACKUP_TIME}" +%s)
          [ "$$next" -gt "$$now" ] || next=$$(date -u -d "tomorrow $${BACKUP_TIME}" +%s)
          sleep $$((next - now))
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          file="/backups/giftcard_pro_$$stamp.sql.gz"
          if mysqldump -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" --single-transaction --quick --routines --triggers --no-tablespaces "$$MYSQL_DATABASE" | gzip -9 > "$$file.part" \
            && gzip -t "$$file.part" && [ "$$(gzip -dc "$$file.part" | tail -c 200 | grep -c 'Dump completed')" -ge 1 ]; then
            mv "$$file.part" "$$file"
            if [ -f /storage/private/crypto/keystore.json ]; then
              cp /storage/private/crypto/keystore.json "/backups/keystore_$$stamp.json"
            fi
            echo "$$stamp $$file" > /backups/last_success
            echo "Backup written: $$file"
          else
            rm -f "$$file.part"
            echo "Backup FAILED" >&2
          fi
          find /backups -name 'giftcard_pro_*.sql.gz' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          find /backups -name 'keystore_*.json' -mtime +"$$BACKUP_KEEP_DAYS" -delete
        done
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-giftcard_pro}
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_MYSQLROOT:?is empty - deploy this resource with Coolify, which generates it; do not run docker compose by hand}
      BACKUP_TIME: ${BACKUP_TIME:-01:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - mysql-backups:/backups
      - laravel-storage:/storage:ro

  # ---------------------------------------------------------------- off-site copy of the backups
  # A backup on the same server is gone with the server. Daily, one hour after the backup, the backup directory is
  # copied to an SFTP server (e.g. a Hetzner Storage Box) through an rclone "crypt" remote: file contents and names
  # are encrypted before they leave, with a password that is not on that server. Without OFFSITE_SFTP_HOST the
  # service only logs that it is off, and ops:check-backups reports it.
  offsite:
    image: rclone/rclone:1.68
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        if [ -z "$${RCLONE_CONFIG_OFFSITE_HOST}" ]; then
          echo "Off-site backup is OFF (OFFSITE_SFTP_HOST not set)."
          while true; do sleep 86400; done
        fi
        echo "Off-site copy daily at $${OFFSITE_TIME} UTC to the encrypted remote, kept $${OFFSITE_KEEP_DAYS} days"
        while true; do
          now=$$(date -u +%s)
          next=$$(date -u -d "$$(date -u +%Y-%m-%d) $${OFFSITE_TIME}" +%s)
          [ "$$next" -gt "$$now" ] || next=$$((next + 86400))
          sleep $$((next - now))
          if rclone copy /backups secure: --exclude 'last_success' --exclude 'offsite_success' --exclude '*.part' \
            && rclone delete secure: --min-age "$${OFFSITE_KEEP_DAYS}d"; then
            date -u +%Y%m%dT%H%M%SZ > /backups/offsite_success
            echo "Off-site copy done"
          else
            echo "Off-site copy FAILED" >&2
          fi
        done
    environment:
      OFFSITE_TIME: ${OFFSITE_TIME:-02:30}
      OFFSITE_KEEP_DAYS: ${OFFSITE_KEEP_DAYS:-60}
      # rclone reads remotes from RCLONE_CONFIG_<NAME>_<OPTION>: "offsite" is the SFTP target, "secure" encrypts on it.
      RCLONE_CONFIG_OFFSITE_TYPE: sftp
      RCLONE_CONFIG_OFFSITE_HOST: ${OFFSITE_SFTP_HOST:-}
      RCLONE_CONFIG_OFFSITE_PORT: ${OFFSITE_SFTP_PORT:-23}
      RCLONE_CONFIG_OFFSITE_USER: ${OFFSITE_SFTP_USER:-}
      RCLONE_CONFIG_OFFSITE_PASS: ${OFFSITE_SFTP_PASS_OBSCURED:-}
      RCLONE_CONFIG_SECURE_TYPE: crypt
      RCLONE_CONFIG_SECURE_REMOTE: offsite:giftcardpro
      RCLONE_CONFIG_SECURE_PASSWORD: ${OFFSITE_CRYPT_PASSWORD_OBSCURED:-}
      RCLONE_CONFIG_SECURE_PASSWORD2: ${OFFSITE_CRYPT_SALT_OBSCURED:-}
    volumes:
      - mysql-backups:/backups

volumes:
  mysql-data:
  mysql-backups:
  redis-data:
  laravel-storage:
